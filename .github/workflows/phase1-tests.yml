name: Phase 1 tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Recompute metadata-only rubric diagnostics
        run: python -m src.rubric_gap_audit --output-dir data/processed
      - name: Report-hardening evidence checks
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter, defaultdict, deque
          import numpy as np
          import pandas as pd
          from scipy import stats
          from src.statistical_audit import holm_adjust
          from src.transformers import LABELS, METRICS

          frame = pd.read_csv("data/processed/canonical_image_manifest.csv")
          near = pd.read_csv("data/processed/near_duplicate_candidates.csv")

          print("=== CANONICAL_CLASSWISE_IQR_FLAGS ===")
          any_flag = np.zeros(len(frame), dtype=bool)
          for metric in METRICS:
              x = frame[metric].astype(float)
              q1, q3 = x.quantile([0.25, 0.75])
              iqr = q3 - q1
              lo, hi = q1 - 1.5 * iqr, q3 + 1.5 * iqr
              mask = x.lt(lo) | x.gt(hi)
              any_flag |= mask.to_numpy()
              for label in LABELS:
                  cm = frame.target_label.eq(label)
                  c = int((mask & cm).sum())
                  print(json.dumps({"metric": metric, "class": label,
                                    "count": c, "n": int(cm.sum()),
                                    "rate": c / int(cm.sum()),
                                    "lower": float(lo), "upper": float(hi)}))
          for label in LABELS:
              cm = frame.target_label.eq(label).to_numpy()
              c = int((any_flag & cm).sum())
              print(json.dumps({"metric": "ANY", "class": label, "count": c,
                                "n": int(cm.sum()), "rate": c / int(cm.sum())}))

          print("=== MIN_MAX_INTENSITY_ENDPOINTS ===")
          for label in ["ALL", *LABELS]:
              part = frame if label == "ALL" else frame[frame.target_label.eq(label)]
              for metric in ["min_intensity", "max_intensity"]:
                  x = part[metric].astype(float)
                  print(json.dumps({"class": label, "metric": metric, "n": len(x),
                                    "min": float(x.min()), "q1": float(x.quantile(.25)),
                                    "median": float(x.median()), "q3": float(x.quantile(.75)),
                                    "max": float(x.max()), "eq0": int((x==0).sum()),
                                    "eq255": int((x==255).sum())}))

          print("=== PHASH_THRESHOLD_SENSITIVITY ===")
          for radius in [2, 4]:
              sub = near[near.phash_distance.le(radius)]
              adj = defaultdict(set)
              for r in sub.itertuples():
                  adj[r.sha256_1].add(r.sha256_2)
                  adj[r.sha256_2].add(r.sha256_1)
              seen=set(); sizes=[]
              for node in list(adj):
                  if node in seen: continue
                  q=deque([node]); seen.add(node); size=0
                  while q:
                      u=q.popleft(); size += 1
                      for v in adj[u]:
                          if v not in seen:
                              seen.add(v); q.append(v)
                  sizes.append(size)
              deg = sorted(((len(v), k) for k,v in adj.items()), reverse=True)
              print(json.dumps({"radius": radius, "pairs": len(sub),
                                "unique_images": len(adj), "components": len(sizes),
                                "largest_component": max(sizes) if sizes else 0,
                                "component_sizes": dict(Counter(sizes)),
                                "max_degree": deg[0][0] if deg else 0}))
          print("distance_counts", near.phash_distance.value_counts().sort_index().to_dict())

          print("=== FILENAME_RELATION_GROUPS ===")
          p_re = re.compile(r"^person([0-9]+)_(bacteria|virus)_", re.I)
          n_re = re.compile(r"^(NORMAL2-)?IM-([0-9]+)-", re.I)
          keys=[]
          for r in frame.itertuples():
              if r.target_label in ("BACTERIAL_PNEUMONIA","VIRAL_PNEUMONIA"):
                  m=p_re.match(r.filename)
                  key=(f"PNEUMONIA|person{int(m.group(1))}" if m
                       else f"UNIQUE|{r.sha256_hash}")
              else:
                  m=n_re.match(r.filename)
                  if m:
                      fam="NORMAL2-IM" if m.group(1) else "IM"
                      key=f"NORMAL|{fam}|{int(m.group(2))}"
                  else:
                      key=f"UNIQUE|{r.sha256_hash}"
              keys.append(key)
          tmp=frame[["target_label"]].copy(); tmp["group"]=keys
          for label in LABELS:
              part=tmp[tmp.target_label.eq(label)]
              sizes=part.groupby("group").size()
              print(json.dumps({"class": label, "images": len(part),
                                "groups": int(sizes.size),
                                "multi_image_groups": int((sizes>1).sum()),
                                "largest_group": int(sizes.max())}))
          allsizes=tmp.groupby("group").size()
          print(json.dumps({"class":"ALL","images":len(tmp),"groups":int(allsizes.size),
                            "multi_image_groups":int((allsizes>1).sum()),
                            "largest_group":int(allsizes.max())}))

          print("=== PAIRWISE_POSTHOC ===")
          rows=[]
          pairs=[("NORMAL","BACTERIAL_PNEUMONIA"),
                 ("NORMAL","VIRAL_PNEUMONIA"),
                 ("BACTERIAL_PNEUMONIA","VIRAL_PNEUMONIA")]
          for metric in METRICS:
              for a,b in pairs:
                  x=frame.loc[frame.target_label.eq(a),metric].to_numpy(float)
                  y=frame.loc[frame.target_label.eq(b),metric].to_numpy(float)
                  res=stats.mannwhitneyu(x,y,alternative="two-sided",method="asymptotic")
                  auc=float(res.statistic/(len(x)*len(y)))
                  rows.append([metric,a,b,float(res.statistic),float(res.pvalue),auc,2*auc-1])
          pvals=np.array([r[4] for r in rows])
          adj=holm_adjust(pvals)
          for r,padj in zip(rows,adj):
              print(json.dumps({"metric":r[0],"a":r[1],"b":r[2],"U":r[3],
                                "p":r[4],"p_holm_18":float(padj),
                                "auc_a_gt_b":r[5],"rank_biserial":r[6]}))
          PY
